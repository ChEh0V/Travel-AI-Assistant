<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel AI Assistant</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#2f6fed; --bot:#eef2fb; --border:#e1e5ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .app { max-width:760px; height:100vh; margin:0 auto; display:flex; flex-direction:column; background:var(--card); border-left:1px solid var(--border); border-right:1px solid var(--border); }
  header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header .logo { font-size:28px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; font-size:15px; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .typing { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 12px; }
  .chips[hidden] { display:none; }
  .chip { border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 20px 20px; border-top:1px solid var(--border); }
  input { flex:1; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button[type=submit] { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .demo { font-size:12px; color:var(--muted); text-align:center; padding-bottom:8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🧭</div>
    <div>
      <h1>Travel AI Assistant</h1>
      <p>Советчик по путешествиям: достопримечательности, маршруты, лайфхаки</p>
    </div>
  </header>
  <main id="chat" aria-live="polite"></main>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" placeholder="Например: что посмотреть в Риме за 2 дня?" autocomplete="off">
    <button type="submit" id="send">Отправить</button>
  </form>
  <div class="demo">Демо-версия: ответы генерирует заглушка, ИИ подключим на следующем этапе</div>
</div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
